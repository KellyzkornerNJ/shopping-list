<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shopping List</title>
<meta name="theme-color" content="#2f6b4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shopping List">
<style>
  :root {
    --bg: #f4f1ea; --card: #ffffff; --ink: #24302a; --muted: #6b766f;
    --accent: #2f6b4f; --accent-ink: #ffffff; --line: #e2ddd2; --danger: #b3412f;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.4 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  header h1 { font-size: 1.5rem; margin: 0; flex: 1; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); }
  button.plain { background: transparent; color: var(--accent); padding: 8px 10px; }
  button.danger { background: transparent; color: var(--danger); }
  button:disabled { opacity: .5; }
  input[type=text], input[type=email], input[type=password], textarea {
    font: inherit; width: 100%; padding: 11px 12px; border: 1px solid var(--line);
    border-radius: 10px; background: #fff; color: var(--ink); }
  textarea { resize: vertical; min-height: 60px; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .hidden { display: none !important; }

  /* Sign in */
  #signin { max-width: 380px; margin: 12vh auto 0; padding: 24px; }
  #signin h1 { margin: 0 0 16px; font-size: 1.5rem; }
  #signin label { display: block; margin: 12px 0 4px; font-size: .9rem; color: var(--muted); }
  #signin button { width: 100%; margin-top: 18px; }
  .msg { color: var(--danger); font-size: .9rem; margin-top: 10px; min-height: 1.2em; }

  /* Add bar */
  .addbar { display: flex; gap: 8px; padding: 10px; margin-bottom: 14px; }
  .addbar input { flex: 1; }

  /* List */
  .section-title { display: flex; align-items: center; justify-content: space-between;
    color: var(--muted); font-size: .9rem; margin: 18px 4px 6px; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.item { margin-bottom: 8px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 12px; }
  .check { width: 28px; height: 28px; flex: 0 0 28px; border-radius: 8px; border: 2px solid var(--accent);
    background: #fff; display: grid; place-items: center; padding: 0; color: var(--accent-ink); }
  .check.on { background: var(--accent); }
  .check svg { width: 18px; height: 18px; }
  .name { flex: 1; min-width: 0; cursor: pointer; }
  .name .t { word-wrap: break-word; }
  .name .n { color: var(--muted); font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li.done .name .t { text-decoration: line-through; color: var(--muted); }
  .badge { font-size: .8rem; color: var(--muted); white-space: nowrap; }
  .details { border-top: 1px solid var(--line); padding: 12px; display: grid; gap: 10px; }
  .details label { font-size: .85rem; color: var(--muted); }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .thumb { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #eee;
    display: grid; place-items: center; cursor: pointer; border: 1px solid var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb .pdf { font-size: .75rem; text-align: center; padding: 6px; word-break: break-word; }
  .thumb .pdf b { display: block; font-size: 1.1rem; color: var(--danger); }
  .thumb .x { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; padding: 0;
    border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; font-size: 15px; line-height: 26px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; }
  .status { font-size: .85rem; color: var(--muted); }

  /* Viewer */
  #viewer { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  #viewer img { max-width: 100%; max-height: 82vh; border-radius: 8px; }
  #viewer .bar { display: flex; gap: 10px; margin-top: 12px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #24302a; color: #fff;
    padding: 10px 16px; border-radius: 10px; font-size: .9rem; z-index: 20; max-width: 90vw; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }

  @media (min-width: 700px) {
    .thumbs { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  }
</style>
</head>
<body>

<!-- Sign In -->
<div id="signin" class="card hidden">
  <h1>Shopping List</h1>
  <form id="signinForm">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="signinBtn">Sign In</button>
    <div class="msg" id="signinMsg"></div>
  </form>
</div>

<!-- App -->
<div id="app" class="wrap hidden">
  <header>
    <h1>Shopping List</h1>
    <span class="status" id="syncStatus"></span>
    <button class="plain" id="signoutBtn">Sign Out</button>
  </header>

  <form class="addbar card" id="addForm">
    <input type="text" id="newItem" placeholder="Add An Item…" autocomplete="off" enterkeyhint="done">
    <button type="submit">Add</button>
  </form>

  <ul class="items" id="todoList"></ul>
  <div class="empty hidden" id="emptyMsg">Nothing on the list yet.</div>

  <div class="section-title hidden" id="doneTitle">
    <span id="doneCount">Checked Off</span>
    <button class="danger" id="clearDoneBtn">Clear Checked</button>
  </div>
  <ul class="items" id="doneList"></ul>
</div>

<!-- Image viewer -->
<div id="viewer" class="hidden">
  <img id="viewerImg" alt="">
  <div class="bar">
    <button id="viewerOpen">Open Full Size</button>
    <button class="plain" id="viewerClose" style="color:#fff">Close</button>
  </div>
</div>

<input type="file" id="filePicker" accept="image/*,application/pdf" multiple class="hidden">

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// ---- Settings ----
const SUPABASE_URL = "https://odaktmqmudvtmlosfxnb.supabase.co";
const SUPABASE_KEY = "sb_publishable_Rxz7DCUmvU0hfebaihNrhQ_E6l0fiFc";
const BUCKET = "attachments";
const MAX_BYTES = 10 * 1024 * 1024;   // 10 MB cap per file
const MAX_IMAGE_PX = 1600;            // photos shrink to this on the long side
const JPEG_QUALITY = 0.82;

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// ---- State ----
let items = [];                 // rows from items
let atts = {};                  // item_id -> [attachment rows]
const open = new Set();         // item ids with details showing
const urlCache = {};            // path -> {url, exp}
let pendingRender = false;
let pickerItemId = null;
let channel = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function toast(text, ms = 2500) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}
function setStatus(text) { $("syncStatus").textContent = text; }

// ---- Sign in / out ----
async function showForSession(session) {
  if (session) {
    $("signin").classList.add("hidden");
    $("app").classList.remove("hidden");
    await loadAll();
    startRealtime();
  } else {
    stopRealtime();
    $("app").classList.add("hidden");
    $("signin").classList.remove("hidden");
  }
}

$("signinForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("signinMsg").textContent = "";
  $("signinBtn").disabled = true;
  const { error } = await sb.auth.signInWithPassword({
    email: $("email").value.trim(), password: $("password").value
  });
  $("signinBtn").disabled = false;
  if (error) $("signinMsg").textContent = error.message;
});

$("signoutBtn").addEventListener("click", async () => {
  if (!confirm("Sign out on this device?")) return;
  await sb.auth.signOut();
});

sb.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_IN" || event === "SIGNED_OUT" || event === "INITIAL_SESSION") {
    // Run outside the callback (Supabase recommends not awaiting its calls in here)
    setTimeout(() => showForSession(session), 0);
  }
});

// ---- Loading ----
async function loadAll() {
  setStatus("Loading…");
  const [r1, r2] = await Promise.all([
    sb.from("items").select("*").order("created_at", { ascending: true }),
    sb.from("attachments").select("*").order("created_at", { ascending: true })
  ]);
  if (r1.error || r2.error) {
    setStatus("Offline?");
    toast("Couldn't load the list: " + (r1.error || r2.error).message, 4000);
    return;
  }
  items = r1.data;
  atts = {};
  for (const a of r2.data) (atts[a.item_id] ||= []).push(a);
  setStatus("");
  render();
}

// Live sync: any change on another device reloads the list
function startRealtime() {
  if (channel) return;
  let timer = null;
  const reload = () => { clearTimeout(timer); timer = setTimeout(loadAll, 300); };
  channel = sb.channel("list-sync")
    .on("postgres_changes", { event: "*", schema: "public", table: "items" }, reload)
    .on("postgres_changes", { event: "*", schema: "public", table: "attachments" }, reload)
    .subscribe();
}
function stopRealtime() { if (channel) { sb.removeChannel(channel); channel = null; } }

// Refresh when the app comes back to the front (phones pause background tabs)
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !$("app").classList.contains("hidden")) loadAll();
});

// ---- Rendering ----
const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';

function render() {
  // Don't wipe out something you're typing in; render after you leave the box
  const ae = document.activeElement;
  if (ae && ae.closest && ae.closest(".details") && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA")) {
    pendingRender = true; return;
  }
  pendingRender = false;

  const todo = items.filter(i => !i.checked);
  const done = items.filter(i => i.checked);
  $("todoList").innerHTML = todo.map(itemHtml).join("");
  $("doneList").innerHTML = done.map(itemHtml).join("");
  $("emptyMsg").classList.toggle("hidden", items.length > 0);
  $("doneTitle").classList.toggle("hidden", done.length === 0);
  $("doneCount").textContent = `Checked Off (${done.length})`;
  loadThumbs();
}

function itemHtml(i) {
  const list = atts[i.id] || [];
  const isOpen = open.has(i.id);
  const noteLine = i.note ? `<div class="n">${esc(i.note)}</div>` : "";
  const badge = list.length ? `<span class="badge">📎 ${list.length}</span>` : "";
  let details = "";
  if (isOpen) {
    const thumbs = list.map(a => {
      const isPdf = a.mime_type === "application/pdf";
      const inner = isPdf
        ? `<div class="pdf"><b>PDF</b>${esc(a.file_name)}</div>`
        : `<img data-path="${esc(a.path)}" alt="${esc(a.file_name)}">`;
      return `<div class="thumb" data-act="view" data-att="${a.id}">${inner}
                <button class="x" data-act="delatt" data-att="${a.id}" title="Remove">✕</button></div>`;
    }).join("");
    details = `
      <div class="details">
        <label>Item</label>
        <input type="text" data-edit="name" data-id="${i.id}" value="${esc(i.name)}">
        <label>Note</label>
        <textarea data-edit="note" data-id="${i.id}" placeholder="Size, brand, how many…">${esc(i.note)}</textarea>
        ${list.length ? `<label>Photos & PDFs</label><div class="thumbs">${thumbs}</div>` : ""}
        <div class="actions">
          <button data-act="attach" data-id="${i.id}">Add Photo / PDF</button>
          <button class="danger" data-act="delete" data-id="${i.id}">Delete Item</button>
        </div>
      </div>`;
  }
  return `
    <li class="item card ${i.checked ? "done" : ""}" data-id="${i.id}">
      <div class="row">
        <button class="check ${i.checked ? "on" : ""}" data-act="toggle" data-id="${i.id}" aria-label="Check off">${i.checked ? CHECK_SVG : ""}</button>
        <div class="name" data-act="expand" data-id="${i.id}"><div class="t">${esc(i.name)}</div>${isOpen ? "" : noteLine}</div>
        ${badge}
      </div>
      ${details}
    </li>`;
}

async function signedUrl(path) {
  const c = urlCache[path];
  if (c && c.exp > Date.now()) return c.url;
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 3600);
  if (error) return null;
  urlCache[path] = { url: data.signedUrl, exp: Date.now() + 55 * 60 * 1000 };
  return data.signedUrl;
}

async function loadThumbs() {
  for (const img of document.querySelectorAll("img[data-path]")) {
    const url = await signedUrl(img.dataset.path);
    if (url) img.src = url;
  }
}

document.addEventListener("focusout", () => {
  setTimeout(() => { if (pendingRender) render(); }, 50);
});

// ---- Actions ----
$("addForm").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("newItem").value.trim();
  if (!name) return;
  $("newItem").value = "";
  const { data, error } = await sb.from("items").insert({ name }).select().single();
  if (error) { toast("Couldn't add: " + error.message); $("newItem").value = name; return; }
  if (!items.some(x => x.id === data.id)) items.push(data);
  render();
  $("newItem").focus();
});

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;

  if (act === "toggle") {
    const it = items.find(x => x.id === id); if (!it) return;
    it.checked = !it.checked; render();                        // show it right away
    const { error } = await sb.from("items").update({ checked: it.checked }).eq("id", id);
    if (error) { it.checked = !it.checked; render(); toast("Couldn't save: " + error.message); }
  }
  else if (act === "expand") {
    open.has(id) ? open.delete(id) : open.add(id); render();
  }
  else if (act === "attach") {
    pickerItemId = id; $("filePicker").value = ""; $("filePicker").click();
  }
  else if (act === "delete") {
    const it = items.find(x => x.id === id); if (!it) return;
    if (!confirm(`Delete "${it.name}" and its photos/PDFs?`)) return;
    await deleteItems([id]);
  }
  else if (act === "delatt") {
    e.stopPropagation();
    const a = findAtt(el.dataset.att); if (!a) return;
    if (!confirm(`Remove "${a.file_name}"?`)) return;
    await sb.storage.from(BUCKET).remove([a.path]);
    const { error } = await sb.from("attachments").delete().eq("id", a.id);
    if (error) toast("Couldn't remove: " + error.message);
    await loadAll();
  }
  else if (act === "view") {
    const a = findAtt(el.dataset.att); if (!a) return;
    const url = await signedUrl(a.path); if (!url) { toast("Couldn't open that file."); return; }
    if (a.mime_type === "application/pdf") { window.open(url, "_blank"); return; }
    $("viewerImg").src = url; $("viewerOpen").dataset.url = url;
    $("viewer").classList.remove("hidden");
  }
});

function findAtt(attId) {
  for (const k in atts) { const a = atts[k].find(x => x.id === attId); if (a) return a; }
  return null;
}

// Save edits to name/note when you leave the box
document.addEventListener("change", async e => {
  const el = e.target;
  if (!el.dataset || !el.dataset.edit) return;
  const field = el.dataset.edit, id = el.dataset.id;
  let value = field === "name" ? el.value.trim() : el.value;
  const it = items.find(x => x.id === id); if (!it) return;
  if (field === "name" && !value) { el.value = it.name; return; }
  it[field] = value;
  const { error } = await sb.from("items").update({ [field]: value }).eq("id", id);
  if (error) toast("Couldn't save: " + error.message);
});

$("clearDoneBtn").addEventListener("click", async () => {
  const done = items.filter(i => i.checked);
  if (!done.length) return;
  if (!confirm(`Clear ${done.length} checked item(s)? Their photos/PDFs are deleted too.`)) return;
  await deleteItems(done.map(i => i.id));
});

async function deleteItems(ids) {
  const paths = ids.flatMap(id => (atts[id] || []).map(a => a.path));
  if (paths.length) await sb.storage.from(BUCKET).remove(paths);
  const { error } = await sb.from("items").delete().in("id", ids);   // attachment rows go with them
  if (error) toast("Couldn't delete: " + error.message);
  ids.forEach(id => open.delete(id));
  await loadAll();
}

// ---- Viewer ----
$("viewerClose").addEventListener("click", () => $("viewer").classList.add("hidden"));
$("viewer").addEventListener("click", e => { if (e.target.id === "viewer") $("viewer").classList.add("hidden"); });
$("viewerOpen").addEventListener("click", () => window.open($("viewerOpen").dataset.url, "_blank"));

// ---- Uploads ----
$("filePicker").addEventListener("change", async () => {
  const files = [...$("filePicker").files];
  const itemId = pickerItemId;
  if (!files.length || !itemId) return;
  for (const f of files) await uploadOne(itemId, f);
  await loadAll();
});

async function uploadOne(itemId, file) {
  const isPdf = file.type === "application/pdf";
  const isImg = file.type.startsWith("image/");
  if (!isPdf && !isImg) { toast(`"${file.name}" isn't a photo or PDF.`); return; }

  let up = file;
  if (isImg) {
    setStatus("Shrinking…");
    up = await shrinkImage(file);
  }
  if (up.size > MAX_BYTES) {
    setStatus("");
    toast(`"${file.name}" is over 10 MB, so it wasn't added.`, 4000);
    return;
  }

  setStatus("Uploading…");
  const safe = up.name.replace(/[^\w.\-]+/g, "_").slice(-80);
  const path = `${itemId}/${crypto.randomUUID()}-${safe}`;
  const { error: e1 } = await sb.storage.from(BUCKET).upload(path, up, { contentType: up.type });
  if (e1) { setStatus(""); toast("Upload failed: " + e1.message, 4000); return; }
  const { error: e2 } = await sb.from("attachments").insert({
    item_id: itemId, path, file_name: file.name, mime_type: up.type, size_bytes: up.size
  });
  if (e2) { await sb.storage.from(BUCKET).remove([path]); toast("Couldn't save: " + e2.message, 4000); }
  setStatus("");
}

// Shrinks a photo to MAX_IMAGE_PX on its long side as a JPEG.
// GIFs, and formats the browser can't read (e.g. HEIC on Android), go up as-is.
async function shrinkImage(file) {
  if (file.type === "image/gif") return file;
  let bmp;
  try { bmp = await createImageBitmap(file); } catch { return file; }
  const scale = Math.min(1, MAX_IMAGE_PX / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  canvas.getContext("2d").drawImage(bmp, 0, 0, w, h);
  const blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", JPEG_QUALITY));
  if (!blob || blob.size >= file.size) return file;          // keep original if it's already smaller
  const name = file.name.replace(/\.[^.]+$/, "") + ".jpg";
  return new File([blob], name, { type: "image/jpeg" });
}

// ---- Offline app shell ----
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
